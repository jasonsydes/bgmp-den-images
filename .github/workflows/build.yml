name: build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bgmp-den-images/rstudio-course:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bgmp-den-images/rstudio-course:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bgmp-den-images/rstudio-course:buildcache,mode=max
